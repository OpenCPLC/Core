# .github/workflows/ci.yml

name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest # the tools Forge installs on a developer's computer
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # Core lies where Forge keeps versions, named without the slashes a PR ref has
      - uses: actions/checkout@v4
        with:
          path: opencplc/ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Forge pinned, so a red run speaks about Core
      - run: pip install opencplc==0.5.0
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/OpenCPLC
          key: opencplc-tools-0.5.0
      # make from Forge's tools, as a new console finds it
      - run: echo "$LOCALAPPDATA\OpenCPLC\make" >> "$GITHUB_PATH"
      - name: Test projects
        run: for pro in opencplc/ci/.tests/*/; do opencplc "${pro%/}" -y && make || exit 1; done
